<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"background": "#fcfcfb", "font": "system-ui, -apple-system, 'Segoe UI', sans-serif", "view": {"stroke": null}, "axis": {"gridColor": "#e1e0d9", "domainColor": "#c3c2b7", "tickColor": "#c3c2b7", "labelColor": "#52514e", "titleColor": "#52514e", "titleFontWeight": "normal", "labelFontSize": 13, "titleFontSize": 14}, "legend": {"labelColor": "#52514e", "titleColor": "#52514e", "orient": "top", "labelFontSize": 13, "symbolStrokeWidth": 3}, "axisX": {"labelAngle": 0}, "title": {"color": "#0b0b0b", "anchor": "start", "fontWeight": 600, "fontSize": 18, "subtitleColor": "#52514e", "subtitleFontSize": 13, "subtitlePadding": 6, "offset": 12}, "line": {"strokeWidth": 2.5}, "point": {"size": 70, "filled": true}}, "data": {"name": "data-c6b5e0aaffcc1f9e6a2b550b087a11cb"}, "mark": {"type": "bar", "color": "#eb6834", "cornerRadiusTopLeft": 4, "cornerRadiusTopRight": 4}, "encoding": {"tooltip": [{"field": "bin", "title": "nearest trade", "type": "nominal"}, {"field": "share", "format": ".1%", "type": "quantitative"}], "x": {"field": "bin", "sort": ["< 15 s", "15\u201330 s", "30\u201360 s", "1\u20132 min", "2\u20135 min", "5\u201310 min", "10\u201330 min", "> 30 min"], "title": "distance from a Kalshi snapshot to the nearest Deribit trade in that expiry", "type": "nominal"}, "y": {"axis": {"format": ".0%"}, "field": "share", "title": "share of Kalshi snapshots", "type": "quantitative"}}, "height": 340, "title": {"text": "Kalshi quotes continuously; Deribit is only seen when someone trades", "subtitle": "25,310 Kalshi snapshots (every 15 minutes); nearest Deribit trade a median 55 s away, 69% within 2 minutes. Deribit's smile there uses a median of 51 trades within \u00b130 min."}, "width": 760, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-c6b5e0aaffcc1f9e6a2b550b087a11cb": [{"bin": "< 15 s", "share": 0.25341762149348085}, {"bin": "15\u201330 s", "share": 0.1185302252074279}, {"bin": "30\u201360 s", "share": 0.14907151323587514}, {"bin": "1\u20132 min", "share": 0.16764124851837217}, {"bin": "2\u20135 min", "share": 0.18474911102331096}, {"bin": "5\u201310 min", "share": 0.08269458711971553}, {"bin": "10\u201330 min", "share": 0.04156459897273805}, {"bin": "> 30 min", "share": 0.0023310944290794154}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
